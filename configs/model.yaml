# ─────────────────────────────────────────────────────────────
# Model Configuration
# Controls: hyperparameters, search spaces, training settings
# ─────────────────────────────────────────────────────────────

logistic_regression:
  max_iter: 1000

random_forest:
  search:
    n_iter: 10
    cv: 3
    scoring: "recall"
  param_grid:
    n_estimators: [200, 400, 600]
    max_depth: [6, 10, null]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]
  fixed_params:
    class_weight: "balanced"
    random_state: 42

xgboost:
  search:
    n_iter: 15
    cv: 3
    scoring: "roc_auc"
  param_grid:
    n_estimators: [300, 500, 700]
    max_depth: [3, 5, 7, 9]
    learning_rate: [0.01, 0.03, 0.05]
    subsample: [0.7, 0.85, 1]
    colsample_bytree: [0.7, 0.85, 1]
    gamma: [0, 0.1, 0.3]
    min_child_weight: [1, 3, 5]
  fixed_params:
    objective: "binary:logistic"
    eval_metric: "logloss"
    random_state: 42

stacking:
  final_estimator: "LogisticRegression"
  base_models:
    - "logistic_regression"
    - "random_forest"
    - "xgboost"
