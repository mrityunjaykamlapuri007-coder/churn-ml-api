# ─────────────────────────────────────────────────────────────
# Application Configuration
# Controls: API settings, Streamlit settings, deployment
# ─────────────────────────────────────────────────────────────

api:
  title: "Customer Churn Prediction API"
  version: "1.0.0"
  host: "0.0.0.0"
  port: 8000

cors:
  allowed_origins:
    - "https://churn-ml-api-6cir.onrender.com"
    - "http://localhost:8501"  # Streamlit dev
    - "http://localhost:3000"  # Frontend dev
  allow_credentials: true
  allow_methods: ["GET", "POST"]
  allow_headers: ["*"]

rate_limit:
  default: "60/minute"
  predict: "30/minute"

streamlit:
  page_title: "Customer Churn Predictor"
  layout: "centered"
  api_url: "https://churn-ml-api-6cir.onrender.com/predict"

risk_thresholds:
  high:
    min_probability: 0.7
    action: "Immediate retention call"
  medium:
    min_probability: 0.5
    action: "Offer discount"
  low:
    min_probability: 0.0
    action: "No action needed"

docker:
  base_image: "python:3.11-slim"
  expose_port: 8000

model:
  metadata_path: "model/metadata.json"
