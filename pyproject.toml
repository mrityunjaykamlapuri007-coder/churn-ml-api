[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-ml-api"
version = "1.0.0"
description = "Customer Churn Prediction — ML Pipeline + FastAPI + Streamlit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Mrityunjay Kamlapuri"},
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pandas>=2.0.0",
    "numpy<2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "pydantic>=2.0.0",
    "streamlit>=1.30.0",
    "requests>=2.31.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
    "kagglehub>=0.2.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.0.0",
    "types-PyYAML>=6.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[project.scripts]
churn-train = "scripts.train:main"
churn-serve = "scripts.serve:main"
churn-evaluate = "scripts.evaluate:main"
churn-data = "scripts.download_data:main"

[tool.setuptools]
packages = ["src", "src.data", "src.features", "src.models", "scripts"]

[tool.pyrefly]
search_path = ["."]
