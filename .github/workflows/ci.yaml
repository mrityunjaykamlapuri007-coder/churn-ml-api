name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint with Ruff
        run: uv run ruff check src/ scripts/ tests/ main.py app.py

      - name: Download Dataset (Required for Tests)
        run: uv run churn-data

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t churn-ml-api .

      - name: Verify container starts
        run: |
          docker run -d --name test-api -p 8000:8000 churn-ml-api
          sleep 5
          curl -f http://localhost:8000/ || exit 1
          docker stop test-api
